<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار خرید پرو</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icons/icon48.svg" alt="Icon">
      <h1>خریدار پرو</h1>
    </header>

    <main id="main-content">
      <div id="permission-section" class="section">
        <div class="welcome-art">🛍️</div>
        <h2>به دستیار خرید خود سلام کنید!</h2>
        <p class="info-text">
          برای دریافت پیشنهادات شگفت‌انگیز و شخصی‌سازی شده، به "خریدار پرو" اجازه دهید تاریخچه مرور شما را تحلیل کند.
        </p>
        <button id="start-btn" class="btn btn-primary">اجازه و شروع</button>
      </div>

      <div id="loading-section" class="section hidden">
        <div class="loader"></div>
        <p class="loading-text">در حال تحلیل سلیقه شما...</p>
      </div>

      <div id="chat-section" class="section hidden">
        <div id="chat-box" class="chat-box"></div>
        <div class="input-area">
          <input type="text" id="user-input" placeholder="از من بپرس..." autocomplete="off" disabled>
          <button id="send-btn" class="send-btn" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
          </button>
        </div>
      </div>

      <div id="error-section" class="section hidden">
        <p class="error-message" id="error-message"></p>
        <button id="retry-btn" class="btn btn-primary">تلاش مجدد</button>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
